[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h-gnn"
version = "0.1.0"
description = "Hamiltonian Graph Neural Network for Orbital Mechanics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "graph neural networks",
    "hamiltonian mechanics",
    "orbital mechanics",
    "symplectic integration",
    "physics-informed ml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch-geometric>=2.0.0",
    "faiss-cpu>=1.7.0",
    "sgp4>=2.20",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
]
experiment = [
    "wandb>=0.12.0",
    "seaborn>=0.11.0",
]
equivariant = [
    "e3nn>=0.5.0",
]
all = [
    "h-gnn[dev,experiment,equivariant]",
]

[project.urls]
Homepage = "https://github.com/your-repo/h-gnn"
Documentation = "https://github.com/your-repo/h-gnn#readme"
Repository = "https://github.com/your-repo/h-gnn"

[project.scripts]
h-gnn-train = "h_gnn.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["h_gnn*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["h_gnn"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=h_gnn --cov-report=term-missing"
